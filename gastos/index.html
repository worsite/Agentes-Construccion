<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://rpavathmxclihhswteiv.supabase.co; img-src data:; base-uri 'none'; form-action 'none'">
<title>Cuentas Claras</title>
<meta name="description" content="Panel de gastos compartidos y pagos mensuales.">
<style>
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#15231F; --ink-soft:#485952; --line:#D9E1DB;
  --primary:#0F6B5A; --primary-dark:#0A5446; --on-primary:#FFFFFF; --tint:#E3F0EC;
  --accent:#9E4A1B; --ok:#1B7040; --warn:#8A5A00; --danger:#B3261E; --focus:#1F5FBF;
  --track:#E4EAE6; --radius:12px;
  --font:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1613; --surface:#18221E; --ink:#E7EFEA; --ink-soft:#A5B6AE; --line:#2B3A34;
    --primary:#4FC1A6; --primary-dark:#7BD5BF; --on-primary:#06241D; --tint:#1C2E28;
    --accent:#E59A68; --ok:#6FD39A; --warn:#E8B64D; --danger:#FF8F86; --focus:#7FB0FF; --track:#26332E;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font)}
h1,h2,h3{line-height:1.2;margin:0 0 .5rem}
h1{font-size:1.5rem} h2{font-size:1.2rem} h3{font-size:1rem}
p{margin:.25rem 0 .75rem}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.brand{font-weight:700;font-size:1.1rem;color:var(--primary);text-decoration:none;margin-right:auto}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a,nav button{min-height:44px;display:inline-flex;align-items:center;padding:0 14px;border-radius:999px;border:1px solid transparent;background:none;color:var(--ink);font:inherit;text-decoration:none;cursor:pointer}
nav a[aria-current="page"]{background:var(--tint);color:var(--primary-dark);font-weight:600}
nav a:hover,nav button:hover{border-color:var(--line)}
main{padding:20px 0 64px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.grid{display:grid;gap:16px}
@media(min-width:720px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}}
.muted{color:var(--ink-soft)} .small{font-size:.875rem}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.big{font-size:1.75rem;font-weight:700;font-variant-numeric:tabular-nums}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
input,select{width:100%;min-height:44px;padding:8px 12px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--ink-soft);border-radius:8px}
.field{margin-bottom:12px}
.fields{display:grid;gap:12px}
@media(min-width:720px){.fields.cols{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}}
.btn{min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--primary);background:var(--primary);color:var(--on-primary);font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.btn.ghost{background:transparent;color:var(--primary-dark);border-color:var(--line)}
.btn.ghost:hover{background:var(--tint)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:44px;padding:0 12px;font-size:.9rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.seg{display:flex;gap:8px}
.seg label{flex:1;margin:0;font-weight:600}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid var(--ink-soft);border-radius:8px;cursor:pointer}
.seg input:checked+span{background:var(--tint);border-color:var(--primary);color:var(--primary-dark)}
.seg input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.bar{height:12px;background:var(--track);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .4s}
.bar.mid>i{background:var(--warn)} .bar.done>i{background:var(--ok)}
@media(prefers-reduced-motion:reduce){.bar>i{transition:none}}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:700;border:1px solid currentColor}
.pill.ok{color:var(--ok)} .pill.pend{color:var(--warn)} .pill.no{color:var(--danger)}
.list{list-style:none;margin:0;padding:0}
.list>li{padding:12px 0;border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs a{min-height:44px;display:inline-flex;align-items:center;padding:0 16px;text-decoration:none;color:var(--ink-soft);border-bottom:3px solid transparent;font-weight:600}
.tabs a[aria-current="true"]{color:var(--primary-dark);border-color:var(--primary)}
.month{display:flex;align-items:center;gap:8px}
.month strong{min-width:9ch;text-align:center}.month strong::first-letter{text-transform:uppercase}
.empty{padding:20px;text-align:center;color:var(--ink-soft);border:1px dashed var(--line);border-radius:8px}
.err{color:var(--danger);font-weight:600;margin:8px 0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;max-width:92vw}
#toast div{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;margin-top:8px;font-weight:600}
#toast div.bad{background:var(--danger);color:#fff}
.narrow{max-width:420px;margin:0 auto}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#/">Cuentas Claras</a>
  <nav id="nav" aria-label="Principal"></nav>
</div></header>
<main><div class="wrap" id="app" aria-live="polite"><p class="muted">Cargando...</p></div></main>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><div class="wrap"><p>Esta aplicación necesita JavaScript.</p></div></noscript>

<script src="vendor/supabase.js"></script>
<script>
'use strict';
/* ===== Configuracion ===== */
const SUPABASE_URL = 'https://rpavathmxclihhswteiv.supabase.co';
// Clave anon (publica por diseno: la seguridad real la dan las politicas RLS de schema.sql).
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwYXZhdGhteGNsaWhoc3d0ZWl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1NTM2ODMsImV4cCI6MjEwODEyOTY4M30.tAycV3dI0v2ZZzEtHkBMduGLYGn5f9BMaKCUZ7FbLEk';
// Supabase Auth exige un correo; el usuario solo ve su nombre de usuario.
// Si Supabase rechaza el dominio ("email address is invalid"), cambialo por uno con MX real.
const DOMINIO_CORREO = 'mailinator.com';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

/* ===== Utilidades ===== */
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const cop = new Intl.NumberFormat('es-CO', { style:'currency', currency:'COP', maximumFractionDigits:0 });
const money = n => cop.format(Number(n) || 0);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; // fecha LOCAL, no UTC
const hoy = () => ymd(new Date());
const mesDe = f => f.slice(0, 7) + '-01';
const sumarMes = (m, n) => { const [y, mm] = m.split('-').map(Number); return ymd(new Date(y, mm - 1 + n, 1)); };
const nombreMes = m => { const [y, mm] = m.split('-').map(Number); return new Date(y, mm - 1, 1).toLocaleDateString('es-CO', { month:'long', year:'numeric' }); };
const fechaCorta = f => { const [y, m, d] = f.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('es-CO', { day:'numeric', month:'short', year:'numeric' }); };
/** "1.250.000" o "1250000" -> 1250000. Solo enteros (COP). Devuelve NaN si no es valido. */
function parseMonto(s) {
  const t = String(s ?? '').trim();
  if (!/^\d{1,3}([.,\s]?\d{3})*$|^\d+$/.test(t)) return NaN;
  return Number(t.replace(/[.,\s]/g, ''));
}
const pct = (parte, total) => total > 0 ? (parte / total) * 100 : null;
const emailDe = u => `${u}@${DOMINIO_CORREO}`;

function bar(valor, total, etiqueta) {
  const p = pct(valor, total);
  if (p === null) return `<p class="muted small">${esc(etiqueta || 'Sin meta definida')}</p>`;
  const w = Math.max(0, Math.min(100, p));
  const cls = p >= 100 ? 'done' : p < 50 ? 'mid' : '';
  return `<div class="bar ${cls}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(p)}" aria-label="${esc(etiqueta || 'Avance')}"><i style="width:${w}%"></i></div>`;
}
const pctTxt = (v, t) => { const p = pct(v, t); return p === null ? '--' : Math.round(p) + '%'; };

function toast(msg, malo) {
  const el = document.createElement('div');
  if (malo) el.className = 'bad';
  el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => el.remove(), malo ? 6000 : 3000);
}
const traducir = e => {
  const m = (e && e.message) || String(e);
  if (/Invalid login credentials/i.test(m)) return 'Usuario o contraseña incorrectos.';
  if (/already registered|already been registered|duplicate key|profiles_username_uq/i.test(m)) return 'Ese nombre de usuario ya existe.';
  if (/Database error saving new user/i.test(m)) return 'No se pudo crear el perfil. Revisa que el usuario tenga 3-20 letras minusculas, numeros o _.';
  if (/email.*invalid|invalid.*email/i.test(m)) return 'Supabase rechazó el correo interno. Cambia DOMINIO_CORREO (ver README).';
  if (/row-level security|permission denied/i.test(m)) return 'No tienes permiso para esta acción.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sin conexión con el servidor. Inténtalo de nuevo.';
  return m;
};
async function q(promesa) { const { data, error } = await promesa; if (error) throw error; return data; }

/* ===== Estado ===== */
const S = { user: null, profile: null, mes: mesDe(hoy()), tab: 'pagos', debtSel: 'todas', debtFecha: '' };

async function cargarSesion() {
  const { data } = await sb.auth.getSession();
  S.user = data && data.session ? data.session.user : null;
  S.profile = null;
  if (S.user) {
    const filas = await q(sb.from('profiles').select('*').eq('id', S.user.id));
    S.profile = filas[0] || null;
  }
}
const aprobado = () => S.profile && S.profile.status === 'approved';
const esAdmin = () => aprobado() && S.profile.is_admin;

/* ===== Navegacion ===== */
function ruta() {
  const h = location.hash.replace(/^#/, '') || '/';
  const [path, qs] = h.split('?');
  return { path, tab: new URLSearchParams(qs || '').get('t') };
}
function pintarNav(path) {
  const a = (href, txt, p) => `<a href="${href}"${path === p ? ' aria-current="page"' : ''}>${txt}</a>`;
  let h = a('#/', 'Panel general', '/');
  if (S.user) {
    h += a('#/perfil', 'Mi perfil', '/perfil');
    if (esAdmin()) h += a('#/admin', 'Admin', '/admin');
    h += `<button type="button" data-action="salir">Salir</button>`;
  } else {
    h += a('#/ingresar', 'Ingresar', '/ingresar');
  }
  document.getElementById('nav').innerHTML = h;
}
async function render() {
  const { path, tab } = ruta();
  if (tab && ['pagos', 'ahorros', 'deudas'].includes(tab)) S.tab = tab;
  pintarNav(path);
  try {
    if (path === '/ingresar') return vistaLogin();
    if (path === '/registro') return vistaRegistro();
    if (path === '/perfil') return S.user ? await vistaPerfil() : (location.hash = '#/ingresar');
    if (path === '/admin') return esAdmin() ? await vistaAdmin() : (location.hash = '#/');
    return await vistaPanel();
  } catch (e) {
    $app.innerHTML = `<div class="card"><p class="err">${esc(traducir(e))}</p><button class="btn" data-action="reintentar">Reintentar</button></div>`;
  }
}

/* ===== Panel general (publico) ===== */
async function vistaPanel() {
  const m = S.mes;
  const [usuarios, gastos] = await Promise.all([
    q(sb.rpc('panel_usuarios', { p_month: m })),
    q(sb.from('general_expenses').select('*').eq('month', m).order('created_at')),
  ]);
  const meta = usuarios.reduce((a, u) => a + Number(u.quota), 0);
  const pagado = usuarios.reduce((a, u) => a + Number(u.paid), 0);
  const gTotal = gastos.reduce((a, g) => a + Number(g.amount), 0);
  const gPagado = gastos.filter(g => g.paid).reduce((a, g) => a + Number(g.amount), 0);

  const cta = S.user ? '' : `<div class="card row between"><div><h2>¿Tienes cuenta?</h2><p class="muted">Entra a tu perfil privado para registrar tus pagos, ahorros y deudas.</p></div>
    <div class="row"><a class="btn" href="#/ingresar" style="display:inline-flex;align-items:center;text-decoration:none">Ingresar a mi perfil</a>
    <a class="btn ghost" href="#/registro" style="display:inline-flex;align-items:center;text-decoration:none">Crear perfil</a></div></div>`;

  $app.innerHTML = `
    <div class="row between" style="margin-bottom:16px">
      <h1>Panel general</h1>
      <div class="month"><button class="btn ghost sm" data-action="mes" data-n="-1" aria-label="Mes anterior">&lsaquo;</button>
        <strong>${esc(nombreMes(m))}</strong>
        <button class="btn ghost sm" data-action="mes" data-n="1" aria-label="Mes siguiente">&rsaquo;</button></div>
    </div>
    <div class="grid two">
      <section class="card"><h2>Meta de aportes del mes</h2>
        <div class="big">${pctTxt(pagado, meta)}</div>
        ${bar(pagado, meta, 'Aportes del mes')}
        <p class="muted small">${money(pagado)} de ${money(meta)}</p></section>
      <section class="card"><h2>Gastos generales pagados</h2>
        <div class="big">${pctTxt(gPagado, gTotal)}</div>
        ${bar(gPagado, gTotal, 'Gastos generales')}
        <p class="muted small">${money(gPagado)} de ${money(gTotal)}</p></section>
    </div>
    <div class="grid two">
      <section class="card"><h2>Gastos generales</h2>
        ${gastos.length ? `<ul class="list">${gastos.map(g => `<li class="row between"><span>${esc(g.name)}</span>
          <span class="row"><span class="num">${money(g.amount)}</span>
          <span class="pill ${g.paid ? 'ok' : 'pend'}">${g.paid ? 'Pagado' : 'Pendiente'}</span></span></li>`).join('')}</ul>`
          : `<div class="empty">No hay gastos registrados para este mes.</div>`}</section>
      <section class="card"><h2>Avance por persona</h2>
        ${usuarios.length ? `<ul class="list">${usuarios.map(u => `<li>
          <div class="row between"><strong>${esc(u.display_name)}</strong><span class="num">${pctTxt(Number(u.paid), Number(u.quota))}</span></div>
          ${bar(Number(u.paid), Number(u.quota), 'Avance de ' + u.display_name)}
          <p class="muted small">Pagado ${money(u.paid)} · Debe ${money(u.quota)}</p></li>`).join('')}</ul>`
          : `<div class="empty">Aún no hay usuarios aprobados.</div>`}</section>
    </div>${cta}`;
}

/* ===== Login / registro ===== */
function vistaLogin() {
  if (S.user) { location.hash = '#/perfil'; return; }
  $app.innerHTML = `<div class="card narrow"><h1>Ingresar a mi perfil</h1>
    <form data-form="login" novalidate>
      <div class="field"><label for="u">Usuario</label><input id="u" name="usuario" autocomplete="username" autocapitalize="none" required></div>
      <div class="field"><label for="p">Contraseña</label><input id="p" name="clave" type="password" autocomplete="current-password" required></div>
      <p class="err" data-err hidden></p>
      <button class="btn" type="submit">Entrar</button>
    </form>
    <p class="muted" style="margin-top:16px">¿Aún no tienes perfil? <a href="#/registro">Crear perfil</a></p></div>`;
}
function vistaRegistro() {
  $app.innerHTML = `<div class="card narrow"><h1>Crear perfil</h1>
    <p class="muted">Tu solicitud llegará a Miguel para ser aprobada.</p>
    <form data-form="registro" novalidate>
      <div class="field"><label for="n">Nombre</label><input id="n" name="nombre" autocomplete="name" maxlength="60" required></div>
      <div class="field"><label for="u">Usuario</label><input id="u" name="usuario" autocomplete="username" autocapitalize="none" maxlength="20" aria-describedby="uh" required>
        <p class="muted small" id="uh">3 a 20 caracteres: letras minusculas, numeros o _</p></div>
      <div class="field"><label for="p">Contraseña</label><input id="p" name="clave" type="password" autocomplete="new-password" minlength="8" aria-describedby="ph" required>
        <p class="muted small" id="ph">Mínimo 8 caracteres</p></div>
      <div class="field"><label for="p2">Repite la contraseña</label><input id="p2" name="clave2" type="password" autocomplete="new-password" required></div>
      <p class="err" data-err hidden></p>
      <button class="btn" type="submit">Enviar solicitud</button>
    </form>
    <p class="muted" style="margin-top:16px">¿Ya tienes perfil? <a href="#/ingresar">Ingresar</a></p></div>`;
}

/* ===== Perfil privado ===== */
const sumar = (a, f = x => x.amount) => a.reduce((t, x) => t + Number(f(x)), 0);
const enMes = (f, m) => mesDe(f) === m;

async function vistaPerfil() {
  if (!S.profile) { $app.innerHTML = `<div class="card"><p class="err">No se encontró tu perfil.</p></div>`; return; }
  if (S.profile.status !== 'approved') {
    $app.innerHTML = `<div class="card narrow"><h1>Hola, ${esc(S.profile.display_name)}</h1>
      <p><span class="pill ${S.profile.status === 'pending' ? 'pend' : 'no'}">${S.profile.status === 'pending' ? 'Pendiente de aprobación' : 'Solicitud rechazada'}</span></p>
      <p class="muted">${S.profile.status === 'pending' ? 'Miguel debe aprobar tu perfil antes de que puedas registrar datos.' : 'Tu solicitud fue rechazada. Habla con Miguel.'}</p></div>`;
    return;
  }
  const tabs = [['pagos', 'Pagos'], ['ahorros', 'Ahorros'], ['deudas', 'Deudas']];
  const cuerpo = S.tab === 'ahorros' ? await tabAhorros() : S.tab === 'deudas' ? await tabDeudas() : await tabPagos();
  $app.innerHTML = `<h1>Mi perfil · ${esc(S.profile.display_name)}</h1>
    <div class="tabs" role="navigation" aria-label="Secciones">${tabs.map(([k, t]) => `<a href="#/perfil?t=${k}" ${S.tab === k ? 'aria-current="true"' : ''}>${t}</a>`).join('')}</div>${cuerpo}`;
}

const campoMetodo = (id = 'm') => `<div class="field"><label id="lm-${id}">Método</label>
  <div class="seg" role="radiogroup" aria-labelledby="lm-${id}">
    <label><input type="radio" name="metodo" value="efectivo" checked><span>Efectivo</span></label>
    <label><input type="radio" name="metodo" value="transferencia"><span>Transferencia</span></label></div></div>`;
const campoMonto = (id = 'monto') => `<div class="field"><label for="${id}">Monto (COP)</label><input id="${id}" name="monto" inputmode="numeric" autocomplete="off" placeholder="50.000" required></div>`;
const campoFecha = (id = 'fecha', label = 'Fecha') => `<div class="field"><label for="f-${id}">${label}</label><input id="f-${id}" name="fecha" type="date" value="${hoy()}" max="2100-12-31" required></div>`;

async function tabPagos() {
  const pagos = await q(sb.from('payments').select('*').order('paid_on', { ascending: false }).order('created_at', { ascending: false }));
  const m = mesDe(hoy());
  const delMes = pagos.filter(p => enMes(p.paid_on, m));
  const totMes = sumar(delMes);
  const ef = sumar(delMes.filter(p => p.method === 'efectivo'));
  const tr = sumar(delMes.filter(p => p.method === 'transferencia'));
  const principal = !delMes.length ? 'Sin pagos este mes' : ef === tr ? 'Empate' : ef > tr ? 'Efectivo' : 'Transferencia';
  const cuota = Number(S.profile.monthly_quota);
  return `<div class="grid two">
    <section class="card"><h2>Registrar pago</h2>
      <form data-form="pago" novalidate>
        ${campoMonto()}${campoMetodo()}${campoFecha()}
        <p class="err" data-err hidden></p>
        <button class="btn" type="submit">Confirmar pago</button>
      </form></section>
    <section class="card"><h2>${esc(nombreMes(m))}</h2>
      <div class="muted small">Acumulado del mes</div><div class="big">${money(totMes)}</div>
      ${bar(totMes, cuota, 'Avance de tu cuota')}
      <p class="muted small">${cuota > 0 ? `${pctTxt(totMes, cuota)} de tu cuota de ${money(cuota)}` : 'Miguel aún no te ha asignado una cuota.'}</p>
      <p><strong>Método principal del mes:</strong> ${principal}</p>

/* --- Deudas --- */
function estadoDeuda(d, balances, pagos) {
  const bs = balances.filter(b => b.debt_id === d.id).sort((a, b) => a.recorded_on.localeCompare(b.recorded_on) || a.created_at.localeCompare(b.created_at));
  const ultimo = bs[bs.length - 1];
  const ps = pagos.filter(p => p.debt_id === d.id);
  // Los pagos anteriores a la ultima actualizacion del monto ya estan reflejados en ese monto.
  // Si caen el mismo dia, cuenta solo el pago registrado despues del valor.
  const desde = ultimo ? ps.filter(p => p.paid_on > ultimo.recorded_on || (p.paid_on === ultimo.recorded_on && p.created_at >= ultimo.created_at)) : [];
  const pagado = sumar(desde);
  const base = ultimo ? Number(ultimo.amount) : 0;
  return { bs, ps, ultimo, base, pagado, resta: Math.max(0, base - pagado) };
}
/** Cuanto pagar por semana/mes para saldar `resta` antes de `fecha` (YYYY-MM-DD). */
function proyectar(resta, fecha) {
  const [y, m, d] = fecha.split('-').map(Number);
  const dias = Math.round((new Date(y, m - 1, d) - new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate())) / 86400000);
  if (resta <= 0) return { listo: true };
  if (dias <= 0) return { vencida: true, resta };
  return { dias, semana: resta / (dias / 7), mes: resta / (dias / 30.4375) };
}
async function tabDeudas() {
  const [deudas, balances, pagos] = await Promise.all([
    q(sb.from('debts').select('*').order('created_at')),
    q(sb.from('debt_balances').select('*')),
    q(sb.from('debt_payments').select('*').order('paid_on', { ascending: false }).order('created_at', { ascending: false })),
  ]);
  const est = Object.fromEntries(deudas.map(d => [d.id, estadoDeuda(d, balances, pagos)]));
  if (S.debtSel !== 'todas' && !est[S.debtSel]) S.debtSel = 'todas';
  const sel = S.debtSel === 'todas' ? deudas : deudas.filter(d => d.id === S.debtSel);
  const resta = sel.reduce((a, d) => a + est[d.id].resta, 0);
  const unica = S.debtSel !== 'todas' ? deudas.find(d => d.id === S.debtSel) : null;
  const fecha = S.debtFecha || (unica && unica.target_date) || '';
  let proy = '<p class="muted">Elige una fecha para ver cuanto debes pagar.</p>';
  if (fecha && deudas.length) {
    const r = proyectar(resta, fecha);
    proy = r.listo ? `<p><span class="pill ok">Sin saldo pendiente</span></p>`
      : r.vencida ? `<p class="err">Esa fecha ya pasó. Saldo pendiente: ${money(r.resta)}.</p>`
      : `<p>Para pagar <strong>${money(resta)}</strong> antes del <strong>${esc(fechaCorta(fecha))}</strong> (${r.dias} días):</p>
         <div class="grid two"><div class="card" style="margin:0"><div class="muted small">Por mes</div><div class="big">${money(Math.ceil(r.mes))}</div></div>
         <div class="card" style="margin:0"><div class="muted small">Por semana</div><div class="big">${money(Math.ceil(r.semana))}</div></div></div>`;
  }
  return `<p class="muted small">Solo tú puedes ver esta sección. Ni el panel general ni el administrador la ven.</p>
  <section class="card"><h2>Registrar deuda</h2>
    <form data-form="deuda" novalidate><div class="fields cols">
      <div class="field"><label for="dn">Nombre</label><input id="dn" name="nombre" maxlength="80" placeholder="Tarjeta, prestamo..." required></div>
      ${campoMonto('dm')}${campoFecha('deuda', 'Fecha del valor')}
      <div class="field"><button class="btn" type="submit">Guardar deuda</button></div></div>
      <p class="err" data-err hidden></p></form></section>
  ${deudas.length ? `<section class="card"><h2>Proyección de pago</h2>
    <div class="fields cols"><div class="field"><label for="ds">Qué quieres pagar</label>
      <select id="ds" data-change="debtSel"><option value="todas"${S.debtSel === 'todas' ? ' selected' : ''}>Todas las deudas</option>
      ${deudas.map(d => `<option value="${esc(d.id)}"${S.debtSel === d.id ? ' selected' : ''}>${esc(d.name)}</option>`).join('')}</select></div>
      <div class="field"><label for="df">Quiero terminar de pagar el</label><input id="df" type="date" value="${esc(fecha)}" data-change="debtFecha"></div>
      ${unica ? `<div class="field"><button class="btn ghost" type="button" data-action="guardar-fecha" data-id="${esc(unica.id)}">Guardar fecha en esta deuda</button></div>` : ''}</div>
    ${proy}</section>` : ''}
  ${deudas.length ? deudas.map(d => {
    const e = est[d.id];
    return `<section class="card"><div class="row between"><h2>${esc(d.name)}</h2>
      <button class="btn danger sm" data-action="del" data-t="debts" data-id="${esc(d.id)}" data-confirm="Se borrará la deuda con sus registros. ¿Continuar?">Eliminar deuda</button></div>
      <div class="row between"><div><div class="muted small">Falta por pagar</div><div class="big">${money(e.resta)}</div></div>
        <div class="muted small">Valor registrado ${money(e.base)}<br>el ${e.ultimo ? esc(fechaCorta(e.ultimo.recorded_on)) : '--'}</div></div>
      ${bar(e.pagado, e.base, 'Avance de ' + d.name)}
      <p class="muted small">${pctTxt(e.pagado, e.base)} pagado desde ese registro (${money(e.pagado)})${d.target_date ? ' · Meta: ' + esc(fechaCorta(d.target_date)) : ''}</p>
      <div class="grid two">
        <form data-form="pago-deuda" data-id="${esc(d.id)}" novalidate><h3>Registrar pago a la deuda</h3>
          ${campoMonto('pm-' + d.id)}${campoFecha('pf-' + d.id)}<p class="err" data-err hidden></p><button class="btn" type="submit">Registrar pago</button></form>
        <form data-form="saldo-deuda" data-id="${esc(d.id)}" novalidate><h3>Actualizar valor (intereses)</h3>
          ${campoMonto('sm-' + d.id)}${campoFecha('sf-' + d.id)}<p class="err" data-err hidden></p><button class="btn ghost" type="submit">Guardar nuevo valor</button></form>
      </div>
      <details><summary>Pagos (${e.ps.length}) y valores (${e.bs.length})</summary>
        ${e.ps.length ? `<h3>Pagos</h3><ul class="list">${e.ps.map(p => `<li class="row between"><span><span class="num">${money(p.amount)}</span><span class="muted"> · ${esc(fechaCorta(p.paid_on))}</span></span>
          <button class="btn danger sm" data-action="del" data-t="debt_payments" data-id="${esc(p.id)}" aria-label="Eliminar pago de ${esc(money(p.amount))}">Eliminar</button></li>`).join('')}</ul>` : ''}
        <h3>Historial de valores</h3><ul class="list">${e.bs.slice().reverse().map(b => `<li class="row between"><span><span class="num">${money(b.amount)}</span><span class="muted"> · ${esc(fechaCorta(b.recorded_on))}</span></span>
          ${e.bs.length > 1 ? `<button class="btn danger sm" data-action="del" data-t="debt_balances" data-id="${esc(b.id)}" aria-label="Eliminar valor de ${esc(money(b.amount))}">Eliminar</button>` : ''}</li>`).join('')}</ul></details></section>`;
  }).join('') : `<div class="empty">Aún no registras deudas.</div>`}`;
}

/* ===== Formularios ===== */
function marcarError(form, msg) {
  const p = form.querySelector('[data-err]');
  if (p) { p.textContent = msg; p.hidden = !msg; } else if (msg) toast(msg, true);
}
const val = (f, n) => f.elements[n] ? f.elements[n].value.trim() : '';
const fechaOk = f => /^\d{4}-\d{2}-\d{2}$/.test(f) && !isNaN(new Date(f + 'T00:00:00'));
const uid = () => S.user.id;
const montoReq = (f, n = 'monto') => { const v = parseMonto(val(f, n)); if (!(v > 0)) throw new Error('Escribe un monto válido mayor a cero.'); return v; };
const fechaReq = (f, n) => { const v = val(f, n); if (!fechaOk(v)) throw new Error('Elige una fecha válida.'); return v; };
const metodoDe = (f, n) => { const r = f.querySelector(`input[name="${n}"]:checked`); return r ? r.value : 'efectivo'; };

const FORMS = {
  async login(f) {
    const u = val(f, 'usuario').toLowerCase(), c = f.elements.clave.value;
    if (!u || !c) throw new Error('Escribe usuario y contraseña.');
    await q(sb.auth.signInWithPassword({ email: emailDe(u), password: c }));
    await cargarSesion(); location.hash = '#/perfil'; await render();
  },
  async registro(f) {
    const nombre = val(f, 'nombre'), u = val(f, 'usuario').toLowerCase(), c = f.elements.clave.value;
    if (!nombre) throw new Error('Escribe tu nombre.');
    if (!/^[a-z0-9_]{3,20}$/.test(u)) throw new Error('Usuario: 3 a 20 caracteres, letras minusculas, numeros o _.');
    if (c.length < 8) throw new Error('La contraseña debe tener al menos 8 caracteres.');
    if (c !== f.elements.clave2.value) throw new Error('Las contraseñas no coinciden.');
    await q(sb.auth.signUp({ email: emailDe(u), password: c, options: { data: { username: u, display_name: nombre } } }));
    await sb.auth.signOut(); await cargarSesion();
    $app.innerHTML = `<div class="card narrow"><h1>Solicitud enviada</h1><p>Miguel revisará tu perfil. Cuando lo apruebe podrás ingresar con tu usuario y contraseña.</p><a class="btn" href="#/" style="display:inline-flex;align-items:center;text-decoration:none">Volver al panel</a></div>`;
  },
  async pago(f) {
    const monto = montoReq(f), fecha = fechaReq(f, 'fecha');
    await q(sb.from('payments').insert({ user_id: uid(), amount: monto, method: metodoDe(f, 'metodo'), paid_on: fecha }));
    toast('Pago registrado'); await render();
  },
  async cuenta(f) {
    const nombre = val(f, 'nombre'); if (!nombre) throw new Error('Escribe para qué es el ahorro.');
    const metaTxt = val(f, 'meta'); let meta = null;
    if (metaTxt) { meta = parseMonto(metaTxt); if (!(meta > 0)) throw new Error('La meta no es válida.'); }
    await q(sb.from('savings_accounts').insert({ user_id: uid(), name: nombre, goal: meta }));
    toast('Cuenta creada'); await render();
  },
  async ahorro(f) {
    const id = f.dataset.id;
    const monto = montoReq(f, 'monto'), fecha = fechaReq(f, 'fecha');
    await q(sb.from('savings_entries').insert({ account_id: id, user_id: uid(), amount: monto, method: metodoDe(f, 'metodo'), entry_on: fecha }));
    toast('Ahorro registrado'); await render();
  },
  async deuda(f) {
    const nombre = val(f, 'nombre'); if (!nombre) throw new Error('Escribe el nombre de la deuda.');
    const monto = parseMonto(val(f, 'monto')); if (!(monto >= 0)) throw new Error('Escribe un monto válido.');
    const fecha = fechaReq(f, 'fecha');
    const d = await q(sb.from('debts').insert({ user_id: uid(), name: nombre }).select());
    await q(sb.from('debt_balances').insert({ debt_id: d[0].id, user_id: uid(), amount: monto, recorded_on: fecha }));
    toast('Deuda registrada'); await render();
  },
  async 'pago-deuda'(f) {
    await q(sb.from('debt_payments').insert({ debt_id: f.dataset.id, user_id: uid(), amount: montoReq(f), paid_on: fechaReq(f, 'fecha') }));
    toast('Pago registrado'); await render();
  },
  async 'saldo-deuda'(f) {
    const monto = parseMonto(val(f, 'monto')); if (!(monto >= 0)) throw new Error('Escribe un monto válido.');
    await q(sb.from('debt_balances').insert({ debt_id: f.dataset.id, user_id: uid(), amount: monto, recorded_on: fechaReq(f, 'fecha') }));
    toast('Valor actualizado'); await render();
  },
  async gasto(f) {
    const nombre = val(f, 'nombre'); if (!nombre) throw new Error('Escribe el nombre del gasto.');
    await q(sb.from('general_expenses').insert({ month: S.mes, name: nombre, amount: montoReq(f) }));
    toast('Gasto agregado'); await render();
  },
  async 'gasto-monto'(f) {
    await q(sb.from('general_expenses').update({ amount: montoReq(f) }).eq('id', f.dataset.id));
    toast('Monto guardado'); await render();
  },
  async cuota(f) {
    const v = parseMonto(val(f, 'monto')); if (!(v >= 0)) throw new Error('Cuota inválida.');
    await q(sb.rpc('admin_set_quota', { p_user: f.dataset.id, p_quota: v }));
    toast('Cuota guardada'); await render();
  },
};

document.addEventListener('submit', async ev => {
  const f = ev.target.closest('form[data-form]'); if (!f) return;
  ev.preventDefault();
  const fn = FORMS[f.dataset.form]; if (!fn) return;
  const btn = f.querySelector('button[type=submit]');
  marcarError(f, ''); if (btn) btn.disabled = true;
  try { await fn(f); } catch (e) { marcarError(f, traducir(e)); }
  finally { if (btn && btn.isConnected) btn.disabled = false; }
});

/* ===== Acciones ===== */
const ACCIONES = {
  async salir() { await sb.auth.signOut(); await cargarSesion(); location.hash = '#/'; await render(); },
  reintentar() { return render(); },
  mes(el) { S.mes = sumarMes(S.mes, Number(el.dataset.n)); return render(); },
  async del(el) {
    if (el.dataset.confirm && !confirm(el.dataset.confirm)) return;
    await q(sb.from(el.dataset.t).delete().eq('id', el.dataset.id)); await render();
  },
  async estado(el) { await q(sb.rpc('admin_set_status', { p_user: el.dataset.id, p_status: el.dataset.s })); toast(el.dataset.s === 'approved' ? 'Usuario aprobado' : 'Solicitud rechazada'); await render(); },
  async copiar() {
    const n = await q(sb.rpc('admin_copy_expenses', { p_from: sumarMes(S.mes, -1), p_to: S.mes }));
    toast(n ? `Se copiaron ${n} gastos` : 'El mes anterior no tiene gastos', !n); await render();
  },
  async 'guardar-fecha'(el) {
    const f = document.getElementById('df').value;
    if (!fechaOk(f)) throw new Error('Elige una fecha válida.');
    await q(sb.from('debts').update({ target_date: f }).eq('id', el.dataset.id)); toast('Fecha guardada'); await render();
  },
};
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-action]'); if (!el) return;
  const fn = ACCIONES[el.dataset.action]; if (!fn) return;
  try { await fn(el); } catch (e) { toast(traducir(e), true); }
});
document.addEventListener('change', async ev => {
  const el = ev.target.closest('[data-change]'); if (!el) return;
  try {
    if (el.dataset.change === 'debtSel') { S.debtSel = el.value; S.debtFecha = ''; await render(); }
    else if (el.dataset.change === 'debtFecha') { S.debtFecha = el.value; await render(); }
    else if (el.dataset.change === 'gasto-pagado') {
      await q(sb.from('general_expenses').update({ paid: el.checked }).eq('id', el.dataset.id)); await render();
    }
  } catch (e) { toast(traducir(e), true); await render(); }
});

window.addEventListener('hashchange', render);
sb.auth.onAuthStateChange(() => {});
(async () => {
  try { await cargarSesion(); } catch (e) { toast(traducir(e), true); }
  await render();
})();
</script>
