<style>
:root{
  --bg:#F2F6FB; --bg2:#E6EEF8; --surface:#FFFFFF; --ink:#0F1B2D; --ink-soft:#4A5B73; --line:#D8E2EF;
  --primary:#0A7D70; --primary-dark:#07635A; --on-primary:#FFFFFF; --tint:#DDF4EF;

}

    --ok:#5BE08F; --ok-tint:#10331F; --warn:#FBBF4D; --danger:#FF8A80; --focus:#8DB8FF; --track:#1F2F47;
    --btn-ink:#04201B; --hero1:#0E8F82; --hero2:#2A56C8; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0A111E; --bg2:#0E1828; --surface:#142033; --ink:#EAF1FB; --ink-soft:#9FB1C9; --line:#243652;
  --primary:#2DD4BF; --primary-dark:#7CE6D6; --on-primary:#04201B; --tint:#12332E;
  --blue:#6EA3FF; --blue-tint:#15264A; --amber:#FBBF4D; --amber-tint:#3A2A0A; --coral:#FF8A80; --coral-tint:#3F1A18;
  --ok:#5BE08F; --ok-tint:#10331F; --warn:#FBBF4D; --danger:#FF8A80; --focus:#8DB8FF; --track:#1F2F47;
  --btn-ink:#04201B; --hero1:#0E8F82; --hero2:#2A56C8; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(180deg,var(--bg2),var(--bg) 320px) var(--bg);background-repeat:no-repeat;color:var(--ink);font:16px/1.5 var(--font);min-height:100vh}

header.top{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}

.row.between{justify-content:space-between}
.num{font-variant-numeric:tabular-nums;font-weight:700}

label{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
input,select{width:100%;min-height:46px;padding:8px 12px;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px}

.field{margin-bottom:12px}
.fields{display:grid;gap:12px}
@media(min-width:720px){.fields.cols{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}}
.btn{min-height:46px;padding:0 20px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--primary),var(--blue));color:var(--btn-ink);font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:filter .2s,transform .1s}

.btn.ghost:hover{background:var(--tint);filter:none}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn.sm{min-height:44px;padding:0 14px;font-size:.9rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.seg{display:flex;gap:8px}
.seg label{flex:1;margin:0;font-weight:600}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:flex;align-items:center;justify-content:center;min-height:46px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;transition:background .2s}
.seg input:checked+span{background:var(--tint);border-color:var(--primary);color:var(--primary-dark)}
.seg input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.bar{height:14px;background:var(--track);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--blue));border-radius:999px;transition:width .5s}
.bar.mid>i{background:linear-gradient(90deg,#F59E0B,#F97316)} .bar.low>i{background:linear-gradient(90deg,#EF4444,#F97316)} .bar.done>i{background:linear-gradient(90deg,#22C55E,#10B981)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:.78rem;font-weight:700}
.pill.ok{background:var(--ok-tint);color:var(--ok)} .pill.pend{background:var(--amber-tint);color:var(--amber)} .pill.no{background:var(--coral-tint);color:var(--danger)}
.list{list-style:none;margin:0;padding:0}
.list>li{padding:12px 0;border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.tabs a{min-height:44px;display:inline-flex;align-items:center;padding:0 16px;text-decoration:none;color:var(--ink-soft);border-radius:999px;font-weight:700;white-space:nowrap;border:1.5px solid var(--line);background:var(--surface)}
.tabs a[aria-current="true"]{background:linear-gradient(135deg,var(--primary),var(--blue));color:var(--btn-ink);border-color:transparent}
.month{display:flex;align-items:center;gap:8px}
.month strong{min-width:9ch;text-align:center}.month strong::first-letter{text-transform:uppercase}
.empty{padding:20px;text-align:center;color:var(--ink-soft);border:1.5px dashed var(--line);border-radius:12px}
.err{color:var(--danger);font-weight:700;margin:8px 0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;max-width:92vw}
#toast div{background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;margin-top:8px;font-weight:700;box-shadow:var(--shadow)}
#toast div.bad{background:#C8382E;color:#fff}
.narrow{max-width:440px;margin:0 auto}
details.debt{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:12px;box-shadow:var(--shadow)}
details.debt>summary{list-style:none;cursor:pointer;padding:14px 16px;min-height:56px;display:block}
details.debt>summary::-webkit-details-marker{display:none}
details.debt>summary .head{display:flex;align-items:center;gap:10px;justify-content:space-between}
details.debt>summary .chev{transition:transform .2s;color:var(--ink-soft)}
details.debt[open]>summary .chev{transform:rotate(180deg)}
details.debt .body{padding:0 16px 16px;border-top:1px solid var(--line);padding-top:14px}
details.mini summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#/"><span class="logo" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2"/><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H5a2 2 0 0 1-2-2"/><circle cx="16.5" cy="14" r="1"/></svg></span>Cuentas Claras</a>
  <nav id="nav" aria-label="Principal"></nav>
  <button id="tema" class="btn ghost" type="button" aria-label="Cambiar entre modo claro y oscuro" style="min-height:44px;width:44px;padding:0"></button>
</div></header>
<main><div class="wrap" id="app" aria-live="polite"><p class="muted">Cargando...</p></div></main>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><div class="wrap"><p>Esta aplicación necesita JavaScript.</p></div></noscript>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
'use strict';
/* ===== Configuracion ===== */
const SUPABASE_URL = 'https://rpavathmxclihhswteiv.supabase.co';
// Clave anon (publica por diseno: la seguridad real la dan las politicas RLS de schema.sql).
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwYXZhdGhteGNsaWhoc3d0ZWl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1NTM2ODMsImV4cCI6MjEwODEyOTY4M30.tAycV3dI0v2ZZzEtHkBMduGLYGn5f9BMaKCUZ7FbLEk';
// Supabase Auth exige un correo; el usuario solo ve su nombre de usuario.
// Si Supabase rechaza el dominio ("email address is invalid"), cambialo por uno con MX real.
const DOMINIO_CORREO = 'mailinator.com';
const DIAS_META = 25; // la cuota mensual se reparte en 25 dias de aporte

// persistSession: la sesion queda guardada en el dispositivo; no se pide la clave otra vez.
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

/* ===== Utilidades ===== */
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const cop = new Intl.NumberFormat('es-CO', { style:'currency', currency:'COP', maximumFractionDigits:0 });
const money = n => cop.format(Math.round(Number(n) || 0));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; // fecha LOCAL, no UTC
const hoy = () => ymd(new Date());
const mesDe = f => f.slice(0, 7) + '-01';
const sumarMes = (m, n) => { const [y, mm] = m.split('-').map(Number); return ymd(new Date(y, mm - 1 + n, 1)); };
const nombreMes = m => { const [y, mm] = m.split('-').map(Number); return new Date(y, mm - 1, 1).toLocaleDateString('es-CO', { month:'long', year:'numeric' }); };
const fechaCorta = f => { const [y, m, d] = f.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('es-CO', { day:'numeric', month:'short', year:'numeric' }); };
/** "1.250.000" o "1250000" -> 1250000. Solo enteros (COP). Devuelve NaN si no es valido. */
function parseMonto(s) {
  const t = String(s ?? '').trim();
  if (!/^\d{1,3}([.,\s]?\d{3})*$|^\d+$/.test(t)) return NaN;
  return Number(t.replace(/[.,\s]/g, ''));
}
const pct = (parte, total) => total > 0 ? (parte / total) * 100 : null;
const emailDe = u => `${u}@${DOMINIO_CORREO}`;

const ICONOS = {
  sol: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  luna: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  billetera: '<path d="M3 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2"/><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H5a2 2 0 0 1-2-2"/><circle cx="16.5" cy="14" r="1"/>',
  calendario: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  meta: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  alerta: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  chevron: '<path d="m6 9 6 6 6-6"/>',
  grafica: '<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>',
};
const ico = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONOS[n]}</svg>`;
const COLORES_AVATAR = ['#0A7D70', '#1D5FD6', '#B45309', '#C8382E', '#6D3FC8', '#0E7490'];
const avatar = nombre => {
  let h = 0; for (const c of String(nombre)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return `<span class="avatar" style="background:${COLORES_AVATAR[h % COLORES_AVATAR.length]}" aria-hidden="true">${esc(String(nombre).trim().charAt(0).toUpperCase())}</span>`;
};

function bar(valor, total, etiqueta) {
  const p = pct(valor, total);
  if (p === null) return `<p class="muted small">${esc(etiqueta || 'Sin meta definida')}</p>`;
  const w = Math.max(0, Math.min(100, p));
  const cls = p >= 100 ? 'done' : p < 35 ? 'low' : p < 70 ? 'mid' : '';
  return `<div class="bar ${cls}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(p)}" aria-label="${esc(etiqueta || 'Avance')}"><i style="width:${w}%"></i></div>`;
}
const pctTxt = (v, t) => { const p = pct(v, t); return p === null ? '--' : Math.round(p) + '%'; };

function toast(msg, malo) {
  const el = document.createElement('div');
  if (malo) el.className = 'bad';
  el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => el.remove(), malo ? 6000 : 3000);
}
const traducir = e => {
  const m = (e && e.message) || String(e);
  if (/Email not confirmed/i.test(m)) return 'Tu correo interno no está confirmado. Ejecuta de nuevo schema.sql en Supabase (ver README).';
  if (/Invalid login credentials/i.test(m)) return 'Usuario o contraseña incorrectos.';
  if (/already registered|already been registered|duplicate key|profiles_username_uq/i.test(m)) return 'Ese nombre de usuario ya existe.';
  if (/Database error saving new user/i.test(m)) return 'No se pudo crear el perfil. Revisa que el usuario tenga 3-20 letras minúsculas, números o _.';
  if (/email.*invalid|invalid.*email/i.test(m)) return 'Supabase rechazó el correo interno. Cambia DOMINIO_CORREO (ver README).';
  if (/row-level security|permission denied/i.test(m)) return 'No tienes permiso para esta acción.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sin conexión con el servidor. Inténtalo de nuevo.';
  return m;
};
async function q(promesa) { const { data, error } = await promesa; if (error) throw error; return data; }

/* ===== Tema claro/oscuro ===== */
function temaActual() {
  const t = document.documentElement.getAttribute('data-theme');
  return t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}
function pintarTema() {
  const oscuro = temaActual() === 'dark';
  const b = document.getElementById('tema');
  b.innerHTML = ico(oscuro ? 'sol' : 'luna');
  b.setAttribute('aria-label', oscuro ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro');
}
document.getElementById('tema').addEventListener('click', () => {
  const nuevo = temaActual() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', nuevo);
  try { localStorage.setItem('cc-tema', nuevo); } catch (e) {}
  pintarTema();
});
pintarTema();

/* ===== Estado ===== */
const S = { user: null, profile: null, mes: mesDe(hoy()), tab: 'pagos', debtSel: 'todas', debtFecha: '', abiertas: new Set() };

async function cargarSesion() {
  const { data } = await sb.auth.getSession();
  S.user = data && data.session ? data.session.user : null;
  S.profile = null;
  if (S.user) {
    const filas = await q(sb.from('profiles').select('*').eq('id', S.user.id));
    S.profile = filas[0] || null;
  }
}
const aprobado = () => S.profile && S.profile.status === 'approved';
const esAdmin = () => aprobado() && S.profile.is_admin;

/** Reparto: gastos del mes entre usuarios aprobados; el minimo diario sale de dividir la cuota en DIAS_META. */
function reparto(usuarios, gastos) {
  const total = gastos.reduce((a, g) => a + Number(g.amount), 0);
  const n = usuarios.length;
  const cuota = n > 0 ? Math.ceil(total / n) : 0;
  return { total, n, cuota, diaria: Math.ceil(cuota / DIAS_META), aportado: usuarios.reduce((a, u) => a + Number(u.paid), 0) };
}

/* ===== Navegacion ===== */
function ruta() {
  const h = location.hash.replace(/^#/, '') || '/';
  const [path, qs] = h.split('?');
  return { path, tab: new URLSearchParams(qs || '').get('t') };
}
function pintarNav(path) {
  const a = (href, txt, p) => `<a href="${href}"${path === p ? ' aria-current="page"' : ''}>${txt}</a>`;
  let h = a('#/', 'Panel', '/');
  if (S.user) {
    h += a('#/perfil', 'Mi perfil', '/perfil');
    if (esAdmin()) h += a('#/admin', 'Admin', '/admin');
    h += `<button type="button" data-action="salir">Salir</button>`;
  } else {
    h += a('#/ingresar', 'Ingresar', '/ingresar');
  }
  document.getElementById('nav').innerHTML = h;
}
async function render() {
  const { path, tab } = ruta();
  if (tab && ['pagos', 'ingreso', 'ahorros', 'deudas'].includes(tab)) S.tab = tab;
  pintarNav(path);
  try {

    $app.innerHTML = `<div class="card"><p class="err">${esc(traducir(e))}</p><button class="btn" data-action="reintentar">Reintentar</button></div>`;
  }
}

/* --- Deudas --- */
function estadoDeuda(d, balances, pagos) {
  const bs = balances.filter(b => b.debt_id === d.id).sort((a, b) => a.recorded_on.localeCompare(b.recorded_on) || a.created_at.localeCompare(b.created_at));
  const ultimo = bs[bs.length - 1];
  const ps = pagos.filter(p => p.debt_id === d.id).sort((a, b) => b.paid_on.localeCompare(a.paid_on) || b.created_at.localeCompare(a.created_at));
  // Los pagos anteriores a la ultima actualizacion del monto ya estan reflejados en ese monto.
  // Si caen el mismo dia, cuenta solo el pago registrado despues del valor.
  const desde = ultimo ? ps.filter(p => p.paid_on > ultimo.recorded_on || (p.paid_on === ultimo.recorded_on && p.created_at >= ultimo.created_at)) : [];
  const pagado = sumar(desde);
  const base = ultimo ? Number(ultimo.amount) : 0;
  return { bs, ps, ultimo, base, pagado, resta: Math.max(0, base - pagado) };
}
/** Cuanto pagar por semana/mes para saldar `resta` antes de `fecha` (YYYY-MM-DD). */
function proyectar(resta, fecha) {
  const [y, m, d] = fecha.split('-').map(Number);
  const dias = Math.round((new Date(y, m - 1, d) - new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate())) / 86400000);
  if (resta <= 0) return { listo: true };
  if (dias <= 0) return { vencida: true, resta };
  return { dias, semana: resta / (dias / 7), mes: resta / (dias / 30.4375) };
}
async function tabDeudas() {

  const est = Object.fromEntries(deudas.map(d => [d.id, estadoDeuda(d, balances, pagos)]));
  if (S.debtSel !== 'todas' && !est[S.debtSel]) S.debtSel = 'todas';
  const sel = S.debtSel === 'todas' ? deudas : deudas.filter(d => d.id === S.debtSel);
  const resta = sel.reduce((a, d) => a + est[d.id].resta, 0);
  const unica = S.debtSel !== 'todas' ? deudas.find(d => d.id === S.debtSel) : null;
  const fecha = S.debtFecha || (unica && unica.target_date) || '';
  let proy = '<p class="muted">Elige una fecha para ver cuánto debes pagar.</p>';
  if (fecha && deudas.length) {
    const r = proyectar(resta, fecha);
    proy = r.listo ? `<p><span class="pill ok">Sin saldo pendiente</span></p>`
      : r.vencida ? `<p class="err">Esa fecha ya pasó. Saldo pendiente: ${money(r.resta)}.</p>`

         <div class="card" style="box-shadow:none"><div class="muted small">Por semana</div><div class="big">${money(Math.ceil(r.semana))}</div></div></div>`;
  }
  return `<p class="muted small">Solo tú puedes ver esta sección. Ni el panel general ni el administrador la ven.</p>
  <section class="card"><h2>Registrar deuda</h2>
    <form data-form="deuda" novalidate><div class="fields cols">
      <div class="field"><label for="dn">Nombre</label><input id="dn" name="nombre" maxlength="80" placeholder="Tarjeta, préstamo..." required></div>

      <div class="field"><button class="btn" type="submit">Guardar deuda</button></div></div>
      <p class="err" data-err hidden></p></form></section>
  ${deudas.length ? `<section class="card"><h2>Proyección de pago</h2>
    <div class="fields cols"><div class="field"><label for="ds">Qué quieres pagar</label>
      <select id="ds" data-change="debtSel"><option value="todas"${S.debtSel === 'todas' ? ' selected' : ''}>Todas las deudas</option>
      ${deudas.map(d => `<option value="${esc(d.id)}"${S.debtSel === d.id ? ' selected' : ''}>${esc(d.name)}</option>`).join('')}</select></div>
      <div class="field"><label for="df">Quiero terminar de pagar el</label><input id="df" type="date" value="${esc(fecha)}" data-change="debtFecha"></div>
      ${unica ? `<div class="field"><button class="btn ghost" type="button" data-action="guardar-fecha" data-id="${esc(unica.id)}">Guardar fecha en esta deuda</button></div>` : ''}</div>
    ${proy}</section>` : ''}
  ${deudas.length ? deudas.map(d => {
    const e = est[d.id];
    return `<details class="debt" data-debt="${esc(d.id)}"${S.abiertas.has(d.id) ? ' open' : ''}><summary>
        <div class="head"><strong>${esc(d.name)}</strong><span class="row" style="gap:10px"><span class="num">${money(e.resta)}</span><span class="chev">${ico('chevron')}</span></span></div>
        <div style="margin-top:8px">${bar(e.pagado, e.base, 'Avance de ' + d.name)}</div>
        <div class="muted small" style="margin-top:4px">${pctTxt(e.pagado, e.base)} pagado · toca para ver detalle</div></summary>
      <div class="body">
      <div class="row between"><div class="muted small">Valor registrado ${money(e.base)} el ${e.ultimo ? esc(fechaCorta(e.ultimo.recorded_on)) : '--'}${d.target_date ? '<br>Meta: ' + esc(fechaCorta(d.target_date)) : ''}</div>
        <button class="btn danger sm" data-action="del" data-t="debts" data-id="${esc(d.id)}" data-confirm="Se borrará la deuda con sus registros. ¿Continuar?">Eliminar deuda</button></div>
      <p class="muted small">Pagado desde ese registro: ${money(e.pagado)}</p>
      <div class="grid two">
        <form data-form="pago-deuda" data-id="${esc(d.id)}" novalidate><h3>Registrar pago a la deuda</h3>
          ${campoMonto('pm-' + d.id)}${campoFecha('pf-' + d.id)}<p class="err" data-err hidden></p><button class="btn" type="submit">Registrar pago</button></form>
        <form data-form="saldo-deuda" data-id="${esc(d.id)}" novalidate><h3>Actualizar valor (intereses)</h3>
          ${campoMonto('sm-' + d.id)}${campoFecha('sf-' + d.id)}<p class="err" data-err hidden></p><button class="btn ghost" type="submit">Guardar nuevo valor</button></form>
      </div>
      <details class="mini"><summary>Pagos (${e.ps.length}) y valores (${e.bs.length})</summary>
        ${e.ps.length ? `<h3>Pagos</h3><ul class="list">${e.ps.map(p => `<li class="row between"><span><span class="num">${money(p.amount)}</span><span class="muted"> · ${esc(fechaCorta(p.paid_on))}</span></span>
          <button class="btn danger sm" data-action="del" data-t="debt_payments" data-id="${esc(p.id)}" aria-label="Eliminar pago de ${esc(money(p.amount))}">Eliminar</button></li>`).join('')}</ul>` : ''}
        <h3>Historial de valores</h3><ul class="list">${e.bs.slice().reverse().map(b => `<li class="row between"><span><span class="num">${money(b.amount)}</span><span class="muted"> · ${esc(fechaCorta(b.recorded_on))}</span></span>
          ${e.bs.length > 1 ? `<button class="btn danger sm" data-action="del" data-t="debt_balances" data-id="${esc(b.id)}" aria-label="Eliminar valor de ${esc(money(b.amount))}">Eliminar</button>` : ''}</li>`).join('')}</ul></details></div></details>`;
  }).join('') : `<div class="empty">Aún no registras deudas.</div>`}`;
}

/* ===== Admin ===== */
async function vistaAdmin() {
  const m = S.mes;
  const [perfiles, gastos, usuarios] = await Promise.all([
    q(sb.from('profiles').select('*').order('created_at')),
    q(sb.from('general_expenses').select('*').eq('month', m).order('created_at')),
    q(sb.rpc('panel_usuarios', { p_month: m })),
  ]);
  const r = reparto(usuarios, gastos);
  const pend = perfiles.filter(p => p.status === 'pending');
  $app.innerHTML = `<h1>Administración</h1>
  <section class="card"><h2>Solicitudes de perfil (${pend.length})</h2>
    ${pend.length ? `<ul class="list">${pend.map(p => `<li class="row between"><span class="row" style="gap:10px">${avatar(p.display_name)}<strong>${esc(p.display_name)}</strong></span>
      <span class="row"><button class="btn sm" data-action="estado" data-id="${esc(p.id)}" data-s="approved">Aprobar</button>
      <button class="btn danger sm" data-action="estado" data-id="${esc(p.id)}" data-s="rejected">Rechazar</button></span></li>`).join('')}</ul>`
      : `<div class="empty">No hay solicitudes pendientes.</div>`}</section>
  <section class="card"><div class="row between"><h2>Gastos generales</h2>${selectorMes()}</div>
    <p class="muted small">Total ${money(r.total)} entre ${r.n} usuarios: cada uno paga ${money(r.cuota)} (${money(r.diaria)} por día en ${DIAS_META} días).</p>
    <form data-form="gasto" novalidate><div class="fields cols">
      <div class="field"><label for="gn">Gasto</label><input id="gn" name="nombre" maxlength="80" placeholder="Gas, agua, luz..." required></div>
      ${campoMonto('gm')}<div class="field"><button class="btn" type="submit">Agregar gasto</button></div></div>
      <p class="err" data-err hidden></p></form>
    ${gastos.length ? `<ul class="list">${gastos.map(g => `<li><div class="row between">
      <label class="row" style="margin:0"><input type="checkbox" style="width:24px;min-height:24px" data-change="gasto-pagado" data-id="${esc(g.id)}"${g.paid ? ' checked' : ''}> <span>${esc(g.name)}</span></label>
      <span class="pill ${g.paid ? 'ok' : 'pend'}">${g.paid ? 'Pagado' : 'Pendiente'}</span></div>
      <form data-form="gasto-monto" data-id="${esc(g.id)}" class="row" style="margin-top:8px" novalidate>
        <input aria-label="Monto de ${esc(g.name)}" name="monto" inputmode="numeric" value="${esc(String(Math.round(Number(g.amount))))}" style="max-width:180px">
        <button class="btn ghost sm" type="submit">Guardar monto</button>
        <button class="btn danger sm" type="button" data-action="del" data-t="general_expenses" data-id="${esc(g.id)}" data-confirm="¿Eliminar este gasto?">Eliminar</button></form></li>`).join('')}</ul>`
      : `<div class="empty">No hay gastos este mes.</div>`}
    <button class="btn ghost" data-action="copiar" style="margin-top:12px">Copiar gastos del mes anterior</button>
    <p class="muted small">La cuota se calcula sola: gastos del mes entre usuarios aprobados. Si entra un usuario nuevo, la cuota de todos baja.</p></section>`;
}

/* ===== Formularios ===== */
function marcarError(form, msg) {
  const p = form.querySelector('[data-err]');
  if (p) { p.textContent = msg; p.hidden = !msg; } else if (msg) toast(msg, true);
}
const val = (f, n) => f.elements[n] ? f.elements[n].value.trim() : '';
const fechaOk = f => /^\d{4}-\d{2}-\d{2}$/.test(f) && !isNaN(new Date(f + 'T00:00:00'));
const uid = () => S.user.id;
const montoReq = (f, n = 'monto') => { const v = parseMonto(val(f, n)); if (!(v > 0)) throw new Error('Escribe un monto válido mayor a cero.'); return v; };
const fechaReq = (f, n) => { const v = val(f, n); if (!fechaOk(v)) throw new Error('Elige una fecha válida.'); return v; };
const metodoDe = (f, n) => { const r = f.querySelector(`input[name="${n}"]:checked`); return r ? r.value : 'efectivo'; };

const FORMS = {
  async login(f) {
    const u = val(f, 'usuario').toLowerCase(), c = f.elements.clave.value;
    if (!u || !c) throw new Error('Escribe usuario y contraseña.');
    await q(sb.auth.signInWithPassword({ email: emailDe(u), password: c }));
    await cargarSesion(); location.hash = '#/perfil'; await render();
  },
  async registro(f) {
    const nombre = val(f, 'nombre'), u = val(f, 'usuario').toLowerCase(), c = f.elements.clave.value;
    if (!nombre) throw new Error('Escribe tu nombre.');
    if (!/^[a-z0-9_]{3,20}$/.test(u)) throw new Error('Usuario: 3 a 20 caracteres, letras minúsculas, números o _.');
    if (c.length < 8) throw new Error('La contraseña debe tener al menos 8 caracteres.');
    if (c !== f.elements.clave2.value) throw new Error('Las contraseñas no coinciden.');
    await q(sb.auth.signUp({ email: emailDe(u), password: c, options: { data: { username: u, display_name: nombre } } }));
    // La sesion se conserva: cuando Miguel apruebe, el usuario entra sin escribir la contraseña.
    await cargarSesion();
    if (S.user) { location.hash = '#/perfil'; await render(); toast('Solicitud enviada'); }
    else $app.innerHTML = `<div class="card narrow"><h1>Solicitud enviada</h1><p>Miguel revisará tu perfil. Cuando lo apruebe podrás ingresar con tu usuario y contraseña.</p><a class="btn" href="#/">Volver al panel</a></div>`;
  },
  async pago(f) {
    const monto = montoReq(f), fecha = fechaReq(f, 'fecha');
    await q(sb.from('payments').insert({ user_id: uid(), amount: monto, method: metodoDe(f, 'metodo'), paid_on: fecha }));
    toast('Pago registrado'); await render();
  },
  async plan(f) {
    const txt = val(f, 'monto'); const v = txt === '' ? 0 : parseMonto(txt);
    if (!(v >= 0)) throw new Error('Escribe un monto válido (0 para no incluirla).');
    await q(sb.from('debts').update({ daily_plan: v }).eq('id', f.dataset.id));
    toast(v > 0 ? 'Plan diario guardado' : 'Deuda fuera del plan diario'); await render();
  },
  async cuenta(f) {
    const nombre = val(f, 'nombre'); if (!nombre) throw new Error('Escribe para qué es el ahorro.');
    const metaTxt = val(f, 'meta'); let meta = null;
    if (metaTxt) { meta = parseMonto(metaTxt); if (!(meta > 0)) throw new Error('La meta no es válida.'); }
    await q(sb.from('savings_accounts').insert({ user_id: uid(), name: nombre, goal: meta }));
    toast('Cuenta creada'); await render();
  },
  async ahorro(f) {
    const monto = montoReq(f, 'monto'), fecha = fechaReq(f, 'fecha');
    await q(sb.from('savings_entries').insert({ account_id: f.dataset.id, user_id: uid(), amount: monto, method: metodoDe(f, 'metodo'), entry_on: fecha }));
    toast('Ahorro registrado'); await render();
  },
  async deuda(f) {
    const nombre = val(f, 'nombre'); if (!nombre) throw new Error('Escribe el nombre de la deuda.');
    const monto = parseMonto(val(f, 'monto')); if (!(monto >= 0)) throw new Error('Escribe un monto válido.');
    const fecha = fechaReq(f, 'fecha');
    const d = await q(sb.from('debts').insert({ user_id: uid(), name: nombre }).select());
    await q(sb.from('debt_balances').insert({ debt_id: d[0].id, user_id: uid(), amount: monto, recorded_on: fecha }));
    toast('Deuda registrada'); await render();
  },
  async 'pago-deuda'(f) {
    await q(sb.from('debt_payments').insert({ debt_id: f.dataset.id, user_id: uid(), amount: montoReq(f), paid_on: fechaReq(f, 'fecha') }));
    S.abiertas.add(f.dataset.id); toast('Pago registrado'); await render();
  },
  async 'saldo-deuda'(f) {
    const monto = parseMonto(val(f, 'monto')); if (!(monto >= 0)) throw new Error('Escribe un monto válido.');
    await q(sb.from('debt_balances').insert({ debt_id: f.dataset.id, user_id: uid(), amount: monto, recorded_on: fechaReq(f, 'fecha') }));
    S.abiertas.add(f.dataset.id); toast('Valor actualizado'); await render();
  },
  async gasto(f) {
    const nombre = val(f, 'nombre'); if (!nombre) throw new Error('Escribe el nombre del gasto.');
    await q(sb.from('general_expenses').insert({ month: S.mes, name: nombre, amount: montoReq(f) }));
    toast('Gasto agregado'); await render();
  },
  async 'gasto-monto'(f) {
    await q(sb.from('general_expenses').update({ amount: montoReq(f) }).eq('id', f.dataset.id));
    toast('Monto guardado'); await render();
  },
};

document.addEventListener('submit', async ev => {
  const f = ev.target.closest('form[data-form]'); if (!f) return;
  ev.preventDefault();
  const fn = FORMS[f.dataset.form]; if (!fn) return;
  const btn = f.querySelector('button[type=submit]');
  marcarError(f, ''); if (btn) btn.disabled = true;
  try { await fn(f); } catch (e) { marcarError(f, traducir(e)); }
  finally { if (btn && btn.isConnected) btn.disabled = false; }
});

/* ===== Acciones ===== */
const ACCIONES = {
  async salir() { await sb.auth.signOut(); await cargarSesion(); location.hash = '#/'; await render(); },
  reintentar() { return render(); },
  mes(el) { S.mes = sumarMes(S.mes, Number(el.dataset.n)); return render(); },
  async del(el) {
    if (el.dataset.confirm && !confirm(el.dataset.confirm)) return;
    await q(sb.from(el.dataset.t).delete().eq('id', el.dataset.id)); await render();
  },
  async estado(el) { await q(sb.rpc('admin_set_status', { p_user: el.dataset.id, p_status: el.dataset.s })); toast(el.dataset.s === 'approved' ? 'Usuario aprobado' : 'Solicitud rechazada'); await render(); },
  async copiar() {
    const n = await q(sb.rpc('admin_copy_expenses', { p_from: sumarMes(S.mes, -1), p_to: S.mes }));
    toast(n ? `Se copiaron ${n} gastos` : 'El mes anterior no tiene gastos', !n); await render();
  },
  async 'guardar-fecha'(el) {
    const f = document.getElementById('df').value;
    if (!fechaOk(f)) throw new Error('Elige una fecha válida.');
    await q(sb.from('debts').update({ target_date: f }).eq('id', el.dataset.id)); toast('Fecha guardada'); await render();
  },
};
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-action]'); if (!el) return;
  const fn = ACCIONES[el.dataset.action]; if (!fn) return;
  try { await fn(el); } catch (e) { toast(traducir(e), true); }
});
document.addEventListener('change', async ev => {
  const el = ev.target.closest('[data-change]'); if (!el) return;
  try {
    if (el.dataset.change === 'debtSel') { S.debtSel = el.value; S.debtFecha = ''; await render(); }
    else if (el.dataset.change === 'debtFecha') { S.debtFecha = el.value; await render(); }
    else if (el.dataset.change === 'gasto-pagado') {
      await q(sb.from('general_expenses').update({ paid: el.checked }).eq('id', el.dataset.id)); await render();
    }
  } catch (e) { toast(traducir(e), true); await render(); }
});
// Recuerda que deudas estan desplegadas para no cerrarlas al refrescar la vista.
document.addEventListener('toggle', ev => {
  const d = ev.target; if (!d.matches || !d.matches('details.debt')) return;
  if (d.open) S.abiertas.add(d.dataset.debt); else S.abiertas.delete(d.dataset.debt);
}, true);

window.addEventListener('hashchange', render);
sb.auth.onAuthStateChange(() => {});
(async () => {
  try { await cargarSesion(); } catch (e) { toast(traducir(e), true); }
  await render();
})();
</script>

</html>
