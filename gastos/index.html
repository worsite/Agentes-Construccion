const COLORES_AVATAR = ['#0A7D70', '#1D5FD6', '#B45309', '#C8382E', '#6D3FC8', '#0E7490'];
const avatar = nombre => {
  let h = 0; for (const c of String(nombre)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return `<span class="avatar" style="background:${COLORES_AVATAR[h % COLORES_AVATAR.length]}" aria-hidden="true">${esc(String(nombre).trim().charAt(0).toUpperCase())}</span>`;
};

function bar(valor, total, etiqueta) {
  const p = pct(valor, total);
  if (p === null) return `<p class="muted small">${esc(etiqueta || 'Sin meta definida')}</p>`;
  const w = Math.max(0, Math.min(100, p));
  const cls = p >= 100 ? 'done' : p < 35 ? 'low' : p < 70 ? 'mid' : '';
  return `<div class="bar ${cls}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(p)}" aria-label="${esc(etiqueta || 'Avance')}"><i style="width:${w}%"></i></div>`;
}
const pctTxt = (v, t) => { const p = pct(v, t); return p === null ? '--' : Math.round(p) + '%'; };

function toast(msg, malo) {
  const el = document.createElement('div');
  if (malo) el.className = 'bad';
  el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => el.remove(), malo ? 6000 : 3000);
}
const traducir = e => {
  const m = (e && e.message) || String(e);
  if (/Email not confirmed/i.test(m)) return 'Tu correo interno no está confirmado. Ejecuta de nuevo schema.sql en Supabase (ver README).';
  if (/WhatsApp invalido/i.test(m)) return 'El número de WhatsApp no es válido.';
  if (/Invalid login credentials/i.test(m)) return 'Usuario o contraseña incorrectos.';
  if (/already registered|already been registered|duplicate key|profiles_username_uq/i.test(m)) return 'Ese nombre de usuario ya existe.';
  if (/Database error saving new user/i.test(m)) return 'No se pudo crear el perfil. Revisa que el usuario tenga 3-20 letras minúsculas, números o _.';
  if (/email.*invalid|invalid.*email/i.test(m)) return 'Supabase rechazó el correo interno. Cambia DOMINIO_CORREO (ver README).';
  if (/row-level security|permission denied/i.test(m)) return 'No tienes permiso para esta acción.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sin conexión con el servidor. Inténtalo de nuevo.';
  return m;
};

/** Deudas generales: lo abonado y lo que falta. NO entran en la cuota ni en el total del mes. */
const resumenDeudas = deudas => deudas.map(d => ({ d, pagado: Number(d.paid), resta: Math.max(0, Number(d.total) - Number(d.paid)) }));
const totalDeuda = deudas => resumenDeudas(deudas).reduce((a, x) => a + x.resta, 0);
const tarjetaDeuda = (x, extra = '') => `<li><div class="row between nw"><span><strong>${esc(x.d.name)}</strong></span>
    <span class="num" style="color:${x.resta > 0 ? 'var(--danger)' : 'var(--ok)'}">${x.resta > 0 ? '-' + money(x.resta) : money(0)}</span></div>
    <div style="margin:8px 0 4px">${bar(x.pagado, Number(x.d.total), 'Avance de ' + x.d.name)}</div>
    <div class="muted small">Total ${money(x.d.total)} · Abonado ${money(x.pagado)} · Falta ${money(x.resta)}</div>${extra}</li>`;

/** Cuanto deberia llevar pagado cada usuario a hoy en el mes `mes` (mes pasado: toda la cuota; futuro: nada). */
function aFecha(mes, r) {
  const act = mesDe(hoy());
  if (mes < act) return r.cuota;
  if (mes > act) return 0;
  return Math.min(r.cuota, r.diaria * Math.min(new Date().getDate(), DIAS_META));
}
/** Reparto: gastos del mes entre usuarios aprobados; el minimo diario sale de dividir la cuota en DIAS_META. */
function reparto(usuarios, gastos) {
  const total = gastos.reduce((a, g) => a + Number(g.amount), 0);
  const n = usuarios.length;
  const cuota = n > 0 ? Math.ceil(total / n) : 0;
  return { total, n, cuota, diaria: Math.ceil(cuota / DIAS_META), aportado: usuarios.reduce((a, u) => a + Number(u.paid), 0) };
}

}

  } else if (S.user) {

       + a('#/perfil?t=ahorros', 'Ahorros', en && t === 'ahorros', 'dsk') + a('#/perfil?t=deudas', 'Deudas', en && t === 'deudas', 'dsk');
    if (esAdmin()) h += `<a href="#/admin"${path === '/admin' ? ' aria-current="page"' : ''} class="iconbtn" aria-label="Administración">${ico('escudo')}<span class="lbl">Admin</span></a>`;
    h += `<button type="button" data-action="salir" class="iconbtn" aria-label="Salir">${ico('salir')}<span class="lbl">Salir</span></button>`;
    b = item('#/', 'Panel', 'inicio', path === '/') + item('#/perfil', 'Cuenta', 'billetera', en && t === 'cuenta')

  } else {

  document.getElementById('nav').innerHTML = h;

/** Datos del reparto del mes actual para el perfil. */
async function datosReparto() {
  const m = mesDe(hoy());
  const [usuarios, gastos] = await Promise.all([
    q(sb.rpc('panel_usuarios', { p_month: m })),
    q(sb.from('general_expenses').select('*').eq('month', m)),
  ]);
  return { m, ...reparto(usuarios, gastos) };
}
/** Situacion del usuario en el mes actual: lo que deberia llevar a hoy, lo que lleva y lo que falta. */
function situacion(rp, pagos) {
  const totMes = sumar(pagos.filter(p => enMes(p.paid_on, rp.m)));
  const dia = Math.min(new Date().getDate(), DIAS_META);
  const esperado = Math.min(rp.cuota, rp.diaria * dia);
  return { totMes, dia, esperado, debeFecha: Math.max(0, esperado - totMes), faltaMes: Math.max(0, rp.cuota - totMes),
           hoyPagado: sumar(pagos.filter(p => p.paid_on === hoy())) };
}

/* --- Mi cuenta: cuanto debo, cuanto he pagado, cuanto falta --- */
async function vistaCuenta() {
  const [pagos, rp, deudas, balances, dpagos] = await Promise.all([
    q(sb.from('payments').select('*').order('paid_on', { ascending: false }).order('created_at', { ascending: false })),
    datosReparto(),
    q(sb.from('debts').select('*').order('created_at')),
    q(sb.from('debt_balances').select('*')),
    q(sb.from('debt_payments').select('*')),
  ]);
  const st = situacion(rp, pagos);

/* --- Deudas --- */
function estadoDeuda(d, balances, pagos) {
  const bs = balances.filter(b => b.debt_id === d.id).sort((a, b) => a.recorded_on.localeCompare(b.recorded_on) || a.created_at.localeCompare(b.created_at));
  const ultimo = bs[bs.length - 1];
  const ps = pagos.filter(p => p.debt_id === d.id).sort((a, b) => b.paid_on.localeCompare(a.paid_on) || b.created_at.localeCompare(a.created_at));
  // Los pagos anteriores a la ultima actualizacion del monto ya estan reflejados en ese monto.
  // Si caen el mismo dia, cuenta solo el pago registrado despues del valor.
  const desde = ultimo ? ps.filter(p => p.paid_on > ultimo.recorded_on || (p.paid_on === ultimo.recorded_on && p.created_at >= ultimo.created_at)) : [];
  const pagado = sumar(desde);
  const base = ultimo ? Number(ultimo.amount) : 0;
  return { bs, ps, ultimo, base, pagado, resta: Math.max(0, base - pagado) };
}
/** Cuanto pagar por semana/mes para saldar `resta` antes de `fecha` (YYYY-MM-DD). */
function proyectar(resta, fecha) {
  const [y, m, d] = fecha.split('-').map(Number);
  const dias = Math.round((new Date(y, m - 1, d) - new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate())) / 86400000);
  if (resta <= 0) return { listo: true };
  if (dias <= 0) return { vencida: true, resta };
  return { dias, semana: resta / (dias / 7), mes: resta / (dias / 30.4375) };
}

  <div class="sect">Pagos recientes de todos</div>
  <section class="card">${recientes.length ? `<ul class="list">${recientes.map(x => `<li class="row between nw"><span><strong>${esc(nombres[x.user_id])}</strong>
    <span class="muted small"> · ${x.method === 'efectivo' ? 'Efectivo' : 'Transferencia'} · ${esc(fechaCorta(x.paid_on))}</span></span><span class="num">${money(x.amount)}</span></li>`).join('')}</ul>`
    : `<div class="empty">Todavía no hay pagos registrados.</div>`}</section>
  <p class="muted small">El botón abre WhatsApp con el mensaje escrito; tú lo revisas y tocas enviar. Los ahorros y las deudas personales de cada usuario siguen siendo privados.</p>`;
}

/* ===== Admin ===== */
async function vistaAdmin() {
  const m = S.mes;
  const [perfiles, gastos, usuarios, deudas] = await Promise.all([
    q(sb.from('profiles').select('*').order('created_at')),
    q(sb.from('general_expenses').select('*').eq('month', m).order('created_at')),
    q(sb.rpc('panel_usuarios', { p_month: m })),
    q(sb.from('general_debts').select('*').order('created_at')).catch(() => []),
  ]);
  const r = reparto(usuarios, gastos);
  const pend = perfiles.filter(p => p.status === 'pending');
  const dgs = resumenDeudas(deudas);

  const solicitudes = `<section class="card"><h2>Solicitudes de perfil (${pend.length})</h2>
    ${pend.length ? `<ul class="list">${pend.map(p => `<li class="row between"><span class="row" style="gap:10px">${avatar(p.display_name)}<strong>${esc(p.display_name)}</strong></span>
      <span class="row"><button class="btn sm" data-action="estado" data-id="${esc(p.id)}" data-s="approved">Aprobar</button>
      <button class="btn danger sm" data-action="estado" data-id="${esc(p.id)}" data-s="rejected">Rechazar</button></span></li>`).join('')}</ul>`
      : `<div class="empty">No hay solicitudes pendientes.</div>`}</section>`;

  const candidatos = perfiles.filter(p => p.status === 'approved' && !p.is_admin);
  const supervisorCard = `<section class="card"><h2>Supervisor</h2>
    <p class="muted small">El supervisor ve todo (pagos de todos, atrasos y WhatsApp) y puede escribirles por WhatsApp, pero <strong>no paga ni cuenta en el reparto</strong>: la cuota de los demás se calcula sin él.</p>
    ${candidatos.length ? `<ul class="list">${candidatos.map(p => `<li class="row between nw"><span class="row" style="gap:10px;flex-wrap:nowrap">${avatar(p.display_name)}<span><strong>${esc(p.display_name)}</strong>${p.is_supervisor ? ' <span class="pill ok">Supervisor</span>' : ''}</span></span>
      <button class="btn ${p.is_supervisor ? 'danger' : 'ghost'} sm" data-action="supervisor" data-id="${esc(p.id)}" data-on="${p.is_supervisor ? 0 : 1}"
        ${p.is_supervisor ? '' : 'data-confirm="Esta persona dejará de contar en el reparto y la cuota de los demás subirá. ¿Asignarla como supervisor?"'}>${p.is_supervisor ? 'Quitar' : 'Asignar'}</button></li>`).join('')}</ul>`
      : `<div class="empty">Aún no hay usuarios aprobados.</div>`}</section>`;
  $app.innerHTML = `<div class="row between" style="margin-bottom:12px"><h1 style="margin:0">Administración</h1>${selectorMes()}</div>
  ${pend.length ? solicitudes : ''}
  <section class="hero" aria-label="Resumen del mes">
    <div class="muted">Total de gastos de ${esc(nombreMes(m))}</div><div class="big">${money(r.total)}</div>
    <div class="trio"><div><div class="k">Usuarios</div><div class="v">${r.n}</div></div>
      <div><div class="k">Cada uno paga</div><div class="v">${money(r.cuota)}</div></div>
      <div><div class="k">Mínimo por día</div><div class="v">${money(r.diaria)}</div></div></div></section>

  <section class="card"><h2>Agregar</h2>
    <form data-form="gasto" novalidate>
      <div class="field"><div class="seg" role="radiogroup" aria-label="Qué vas a agregar">
        <label><input type="radio" name="tipo" value="gasto" data-change="tipo" checked><span>Gasto del mes</span></label>
        <label><input type="radio" name="tipo" value="deuda" data-change="tipo"><span>Deuda general</span></label></div></div>
      <div class="field"><label for="gn">Nombre</label><input id="gn" name="nombre" maxlength="80" placeholder="Gas, agua, reparación..." required></div>
      <div class="field"><label for="gm" id="gmL">Monto (COP)</label><input id="gm" name="monto" inputmode="numeric" autocomplete="off" placeholder="50.000" data-fmt required></div>
      <p class="muted small" id="avisoDeuda" hidden>La deuda general <strong>no</strong> suma a la cuota del mes: se muestra aparte, en rojo y en negativo, hasta que la marques como pagada.</p>
      <p class="err" data-err hidden></p>
      <button class="btn block" type="submit" id="gBtn">Agregar gasto</button>
    </form></section>

  <section class="card"><h2>Gastos de ${esc(nombreMes(m))}</h2>
    ${gastos.length ? `<ul class="list">${gastos.map(g => `<li><div class="row between nw">
      <label class="row" style="margin:0;flex-wrap:nowrap"><input type="checkbox" style="width:24px;min-height:24px" data-change="gasto-pagado" data-id="${esc(g.id)}"${g.paid ? ' checked' : ''}> <span>${esc(g.name)}</span></label>
      <span class="pill ${g.paid ? 'ok' : 'pend'}">${g.paid ? 'Pagado' : 'Pendiente'}</span></div>
      <form data-form="gasto-monto" data-id="${esc(g.id)}" class="row" style="margin-top:8px;flex-wrap:nowrap" novalidate>
        <input aria-label="Monto de ${esc(g.name)}" name="monto" inputmode="numeric" data-fmt value="${esc(Math.round(Number(g.amount)).toLocaleString('es-CO'))}">
        <button class="btn ghost sm" type="submit">Guardar</button>
        <button class="btn danger sm" type="button" data-action="del" data-t="general_expenses" data-id="${esc(g.id)}" data-confirm="¿Eliminar este gasto?">Eliminar</button></form></li>`).join('')}</ul>`
      : `<div class="empty">No hay gastos este mes.</div>`}
    <button class="btn ghost" data-action="copiar" style="margin-top:12px">Copiar gastos del mes anterior</button></section>

  ${dgs.length ? `<section class="card"><h2>Deudas generales</h2>
    <p class="muted small">Total pendiente: <strong style="color:var(--danger)">${totalDeuda(deudas) > 0 ? '-' + money(totalDeuda(deudas)) : money(0)}</strong></p>
    <ul class="list">${dgs.map(x => tarjetaDeuda(x, `<form data-form="abono-dg" data-id="${esc(x.d.id)}" class="row" style="margin-top:8px;flex-wrap:nowrap" novalidate>
        ${x.resta > 0 ? `<input aria-label="Abono a ${esc(x.d.name)}" name="monto" inputmode="numeric" data-fmt placeholder="Abono">
        <button class="btn sm" type="submit">Abonar</button><button class="btn ghost sm" type="button" data-action="saldar-dg" data-id="${esc(x.d.id)}" data-v="${x.resta}">Pagada</button>` : '<span class="pill ok">Saldada</span>'}
        <button class="btn danger sm" type="button" data-action="borrar-dg" data-id="${esc(x.d.id)}" data-confirm="Se borrará la deuda. ¿Continuar?">Eliminar</button></form><p class="err" data-err hidden></p>`)).join('')}</ul></section>` : ''}
  ${supervisorCard}
  ${pend.length ? '' : solicitudes}
  <p class="muted small">La cuota se calcula sola: gastos del mes entre usuarios aprobados. Si entra un usuario nuevo, la cuota de todos baja.</p>`;
}

/* ===== Formularios ===== */
function marcarError(form, msg) {
  const p = form.querySelector('[data-err]');
  if (p) { p.textContent = msg; p.hidden = !msg; } else if (msg) toast(msg, true);
}
const val = (f, n) => f.elements[n] ? f.elements[n].value.trim() : '';
const fechaOk = f => /^\d{4}-\d{2}-\d{2}$/.test(f) && !isNaN(new Date(f + 'T00:00:00'));
const uid = () => S.user.id;
const montoReq = (f, n = 'monto') => { const v = parseMonto(val(f, n)); if (!(v > 0)) throw new Error('Escribe un monto válido mayor a cero.'); return v; };
const fechaReq = (f, n) => { const v = val(f, n); if (!fechaOk(v)) throw new Error('Elige una fecha válida.'); return v; };
const metodoDe = (f, n) => { const r = f.querySelector(`input[name="${n}"]:checked`); return r ? r.value : 'efectivo'; };

const FORMS = {
  async login(f) {
    const u = val(f, 'usuario').toLowerCase(), c = f.elements.clave.value;
    if (!u || !c) throw new Error('Escribe usuario y contraseña.');
    await q(sb.auth.signInWithPassword({ email: emailDe(u), password: c }));
    await cargarSesion(); location.hash = '#/perfil'; await render();
  },
  async registro(f) {
    const nombre = val(f, 'nombre'), u = val(f, 'usuario').toLowerCase(), c = f.elements.clave.value;
    if (!nombre) throw new Error('Escribe tu nombre.');
    if (!/^[a-z0-9_]{3,20}$/.test(u)) throw new Error('Usuario: 3 a 20 caracteres, letras minúsculas, números o _.');
    const wa = normWhatsapp(val(f, 'whatsapp'));
    if (!wa) throw new Error('Escribe un número de WhatsApp válido (ej. 300 123 4567).');
    if (c.length < 8) throw new Error('La contraseña debe tener al menos 8 caracteres.');
    if (c !== f.elements.clave2.value) throw new Error('Las contraseñas no coinciden.');
    await q(sb.auth.signUp({ email: emailDe(u), password: c, options: { data: { username: u, display_name: nombre, whatsapp: wa } } }));
    // La sesion se conserva: cuando Miguel apruebe, el usuario entra sin escribir la contraseña.
    await cargarSesion();
    if (S.user) { location.hash = '#/perfil'; await render(); toast('Solicitud enviada'); }
    else $app.innerHTML = `<div class="card narrow"><h1>Solicitud enviada</h1><p>Miguel revisará tu perfil. Cuando lo apruebe podrás ingresar con tu usuario y contraseña.</p><a class="btn" href="#/">Volver al panel</a></div>`;
  },
  async pago(f) {
    const monto = montoReq(f), fecha = fechaReq(f, 'fecha');
    await q(sb.from('payments').insert({ user_id: uid(), amount: monto, method: metodoDe(f, 'metodo'), paid_on: fecha }));
    S.ultimo = { monto }; await render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  },
  async whatsapp(f) {
    const wa = normWhatsapp(val(f, 'whatsapp'));
    if (!wa) throw new Error('Escribe un número de WhatsApp válido (ej. 300 123 4567).');
    await q(sb.rpc('set_my_whatsapp', { p_number: wa }));
    await cargarSesion(); toast('WhatsApp guardado'); location.hash = esSupervisor() ? '#/supervision' : '#/perfil'; await render();
  },
  async 'abono-dg'(f) {
    await q(sb.rpc('admin_pay_general_debt', { p_id: f.dataset.id, p_amount: montoReq(f) }));
    toast('Abono registrado'); await render();
  },
  async plan(f) {
    const txt = val(f, 'monto'); const v = txt === '' ? 0 : parseMonto(txt);
    if (!(v >= 0)) throw new Error('Escribe un monto válido (0 para no incluirla).');
    await q(sb.from('debts').update({ daily_plan: v }).eq('id', f.dataset.id));
    toast(v > 0 ? 'Plan diario guardado' : 'Deuda fuera del plan diario'); await render();
  },
  async cuenta(f) {
    const nombre = val(f, 'nombre'); if (!nombre) throw new Error('Escribe para qué es el ahorro.');
    const metaTxt = val(f, 'meta'); let meta = null;
    if (metaTxt) { meta = parseMonto(metaTxt); if (!(meta > 0)) throw new Error('La meta no es válida.'); }
    await q(sb.from('savings_accounts').insert({ user_id: uid(), name: nombre, goal: meta }));
    toast('Cuenta creada'); await render();
  },
  async ahorro(f) {
    const monto = montoReq(f, 'monto'), fecha = fechaReq(f, 'fecha');
    await q(sb.from('savings_entries').insert({ account_id: f.dataset.id, user_id: uid(), amount: monto, method: metodoDe(f, 'metodo'), entry_on: fecha }));
    toast('Ahorro registrado'); await render();
  },
  async deuda(f) {
    const nombre = val(f, 'nombre'); if (!nombre) throw new Error('Escribe el nombre de la deuda.');
    const monto = parseMonto(val(f, 'monto')); if (!(monto >= 0)) throw new Error('Escribe un monto válido.');
    const fecha = fechaReq(f, 'fecha');
    const d = await q(sb.from('debts').insert({ user_id: uid(), name: nombre }).select());
    await q(sb.from('debt_balances').insert({ debt_id: d[0].id, user_id: uid(), amount: monto, recorded_on: fecha }));
    toast('Deuda registrada'); await render();
  },
  async 'pago-deuda'(f) {
    await q(sb.from('debt_payments').insert({ debt_id: f.dataset.id, user_id: uid(), amount: montoReq(f), paid_on: fechaReq(f, 'fecha') }));
    S.abiertas.add(f.dataset.id); toast('Pago registrado'); await render();
  },
  async 'saldo-deuda'(f) {
    const monto = parseMonto(val(f, 'monto')); if (!(monto >= 0)) throw new Error('Escribe un monto válido.');
    await q(sb.from('debt_balances').insert({ debt_id: f.dataset.id, user_id: uid(), amount: monto, recorded_on: fechaReq(f, 'fecha') }));
    S.abiertas.add(f.dataset.id); toast('Valor actualizado'); await render();
  },
  async gasto(f) {
    const nombre = val(f, 'nombre'); if (!nombre) throw new Error('Escribe el nombre del gasto.');
    const tipo = (f.querySelector('input[name=tipo]:checked') || {}).value;
    if (tipo === 'deuda') {
      await q(sb.rpc('admin_add_general_debt', { p_name: nombre, p_total: montoReq(f) }));
      toast('Deuda general agregada');
    } else {
      await q(sb.from('general_expenses').insert({ month: S.mes, name: nombre, amount: montoReq(f) }));
      toast('Gasto agregado');
    }
    await render();
  },
  async 'gasto-monto'(f) {
    await q(sb.from('general_expenses').update({ amount: montoReq(f) }).eq('id', f.dataset.id));
    toast('Monto guardado'); await render();
  },
};

document.addEventListener('submit', async ev => {
  const f = ev.target.closest('form[data-form]'); if (!f) return;
  ev.preventDefault();
  const fn = FORMS[f.dataset.form]; if (!fn) return;
  const btn = f.querySelector('button[type=submit]');
  marcarError(f, ''); if (btn) btn.disabled = true;
  try { await fn(f); } catch (e) { marcarError(f, traducir(e)); }
  finally { if (btn && btn.isConnected) btn.disabled = false; }
});

/* ===== Acciones ===== */
const ACCIONES = {
  async salir() { await sb.auth.signOut(); await cargarSesion(); location.hash = '#/'; await render(); },
  reintentar() { return render(); },
  monto(el) { const i = document.getElementById('monto'); i.value = Number(el.dataset.v).toLocaleString('es-CO'); i.focus(); },
  fecha(el) { const c = document.getElementById('fechaIn'); c.hidden = !c.hidden; el.textContent = c.hidden ? 'Cambiar fecha' : 'Listo'; if (!c.hidden) c.querySelector('input').focus(); },
  mes(el) { S.mes = sumarMes(S.mes, Number(el.dataset.n)); return render(); },
  async del(el) {
    if (el.dataset.confirm && !confirm(el.dataset.confirm)) return;
    await q(sb.from(el.dataset.t).delete().eq('id', el.dataset.id)); await render();
  },
  async supervisor(el) {
    if (el.dataset.confirm && !confirm(el.dataset.confirm)) return;
    await q(sb.rpc('admin_set_supervisor', { p_user: el.dataset.id, p_on: el.dataset.on === '1' }));
    toast(el.dataset.on === '1' ? 'Supervisor asignado' : 'Supervisor quitado'); await render();
  },
  async 'saldar-dg'(el) {
    await q(sb.rpc('admin_pay_general_debt', { p_id: el.dataset.id, p_amount: Number(el.dataset.v) })); toast('Deuda saldada'); await render();
  },
  async 'borrar-dg'(el) {
    if (!confirm(el.dataset.confirm)) return;
    await q(sb.rpc('admin_delete_general_debt', { p_id: el.dataset.id })); toast('Deuda eliminada'); await render();
  },
  async estado(el) { await q(sb.rpc('admin_set_status', { p_user: el.dataset.id, p_status: el.dataset.s })); toast(el.dataset.s === 'approved' ? 'Usuario aprobado' : 'Solicitud rechazada'); await render(); },
  async copiar() {
    const n = await q(sb.rpc('admin_copy_expenses', { p_from: sumarMes(S.mes, -1), p_to: S.mes }));
    toast(n ? `Se copiaron ${n} gastos` : 'El mes anterior no tiene gastos', !n); await render();
  },
  async 'guardar-fecha'(el) {
    const f = document.getElementById('df').value;
    if (!fechaOk(f)) throw new Error('Elige una fecha válida.');
    await q(sb.from('debts').update({ target_date: f }).eq('id', el.dataset.id)); toast('Fecha guardada'); await render();
  },
};
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-action]'); if (!el) return;
  const fn = ACCIONES[el.dataset.action]; if (!fn) return;
  try { await fn(el); } catch (e) { toast(traducir(e), true); }
});
document.addEventListener('change', async ev => {
  const el = ev.target.closest('[data-change]'); if (!el) return;
  try {
    if (el.dataset.change === 'tipo') {
      const deuda = el.value === 'deuda';
      document.getElementById('avisoDeuda').hidden = !deuda;
      document.getElementById('gBtn').textContent = deuda ? 'Agregar deuda general' : 'Agregar gasto';
      document.getElementById('gmL').textContent = deuda ? 'Monto total (COP)' : 'Monto (COP)';
    }
    else if (el.dataset.change === 'debtSel') { S.debtSel = el.value; S.debtFecha = ''; await render(); }
    else if (el.dataset.change === 'debtFecha') { S.debtFecha = el.value; await render(); }
    else if (el.dataset.change === 'gasto-pagado') {
      await q(sb.from('general_expenses').update({ paid: el.checked }).eq('id', el.dataset.id)); await render();
    }
  } catch (e) { toast(traducir(e), true); await render(); }
});
// Recuerda que deudas estan desplegadas para no cerrarlas al refrescar la vista.
document.addEventListener('toggle', ev => {
  const d = ev.target; if (!d.matches || !d.matches('details.debt')) return;
  if (d.open) S.abiertas.add(d.dataset.debt); else S.abiertas.delete(d.dataset.debt);
}, true);

document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.matches && el.matches('input[data-fmt]')) {
    const d = el.value.replace(/\D/g, '');
    el.value = d ? Number(d).toLocaleString('es-CO') : '';
  } else if (el.matches && el.matches('#fechaIn input')) {
    const t = document.getElementById('fechaTxt');
    if (t && /^\d{4}-\d{2}-\d{2}$/.test(el.value)) t.textContent = el.value === hoy() ? `Hoy · ${fechaCorta(el.value)}` : fechaCorta(el.value);
  }
});
window.addEventListener('hashchange', render);
sb.auth.onAuthStateChange(() => {});
(async () => {
  try { await cargarSesion(); } catch (e) { toast(traducir(e), true); }
  await render();
})();
</script>
